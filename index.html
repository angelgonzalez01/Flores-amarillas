<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Día de las Flores Amarillas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky"></div>
  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <main>
    <section class="hero">
      <p class="small-title">Un pequeño detalle para alegrarte el día</p>
      <h1>¡Feliz Día de las<br><span>Flores Amarillas!</span></h1>
      <p class="message">Que nunca te falten motivos para sonreír, florecer y llenar tus días de color. 🌻</p>
      <button id="bloomBtn">🌱 Hacer florecer el jardín</button>
    </section>

    <section class="garden" id="garden" aria-label="Jardín de flores amarillas">
      <div class="ground"></div>
    </section>
  </main>

  <div id="petals"></div>
  <div class="heart">♥</div>

  <script src="script.js"></script>
</body>
</html>
